version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: tp-mongodb-service
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: tp-redis-service
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
